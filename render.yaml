services:
  # 1. FastAPI Backend (Web Service)
  - type: web
    name: sa-ats-backend
    env: python
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sa-ats-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_NAME
        value: "RecruitPro SA"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"

  # 2. React Frontend (Static Site)
  - type: web
    name: sa-ats-frontend
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          name: sa-ats-backend
          type: web
          property: host

databases:
  - name: sa-ats-db
    databaseName: recruitpro_sa
    user: recruitpro_user
    plan: free
